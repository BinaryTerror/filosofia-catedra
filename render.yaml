services:
  - type: web
    name: catedra-static
    runtime: static
    buildCommand: npm ci && npm run verify
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
